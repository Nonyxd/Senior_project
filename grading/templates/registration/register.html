<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - OMR System</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .register-card {
            background: white;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .register-title {
            color: #333;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .register-subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        form {
            text-align: left;
        }

        form p {
            margin-bottom: 15px;
        }

        form label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        form input[type="text"],
        form input[type="password"],
        form input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        form input:focus {
            outline: none;
            border-color: #2196F3;
        }

        .helptext {
            display: none; /* ซ่อนข้อความแนะนำรหัสผ่านยาวๆ ของระบบ */
        }

        form ul {
            padding-left: 20px;
            margin-top: 5px;
            margin-bottom: 0;
            font-size: 12px;
            color: #666;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s;
            font-family: 'Sarabun', sans-serif;
        }

        .btn-submit:hover {
            background-color: #45a049;
        }

        .btn-back {
            display: inline-block;
            width: 100%;
            padding: 10px;
            background-color: transparent;
            color: #2196F3;
            border: 1px solid #2196F3;
            border-radius: 5px;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
            margin-top: 15px;
            box-sizing: border-box;
            transition: background-color 0.3s;
            text-align: center;
        }

        .btn-back:hover {
            background-color: #e3f2fd;
        }

        .error-msg {
            color: #d32f2f;
            background: #ffcdd2;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: left;
            border: 1px solid #ef9a9a;
        }
        
        .errorlist {
            color: #d32f2f;
            font-size: 12px;
            padding-left: 0;
            list-style-type: none;
            margin: 5px 0 0 0;
        }

        /* คลาสใหม่สำหรับครอบช่องรหัสผ่านและปุ่มตา */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            cursor: pointer;
            color: #666;
            user-select: none;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="register-card">
    <h2 class="register-title">สมัครสมาชิกใหม่</h2>
    <div class="register-subtitle">สร้างบัญชีผู้ใช้สำหรับระบบตรวจข้อสอบ OMR</div>

    {% if messages %}
        {% for message in messages %}
            {% if message.tags == 'error' %}
                <div class="error-msg">{{ message }}</div>
            {% endif %}
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">ยืนยันการสมัครสมาชิก</button>
    </form>
    
    <a href="{% url 'login' %}" class="btn-back">มีบัญชีอยู่แล้ว? กลับไปหน้าเข้าสู่ระบบ</a>
</div>

<script>
    // สคริปต์สำหรับใส่ลูกตาและลิมิตความยาว 50 ตัวอักษร
    document.addEventListener("DOMContentLoaded", function() {
        const passwordInputs = document.querySelectorAll('form p input[type="password"]');
        
        passwordInputs.forEach((input) => {
            // 🌟 1. บังคับพิมพ์ได้สูงสุดแค่ 50 ตัวอักษร
            input.maxLength = 50;

            // 🌟 2. สร้างกรอบมาครอบ Input เดิม
            const wrapper = document.createElement('div');
            wrapper.className = 'password-wrapper';
            input.parentNode.insertBefore(wrapper, input);
            wrapper.appendChild(input);

            // 🌟 3. สร้างปุ่มลูกตา
            const toggleSpan = document.createElement("span");
            toggleSpan.className = "toggle-password";
            toggleSpan.innerHTML = `
                <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            `;
            
            // เอาปุ่มลูกตาไปใส่ในกรอบ
            wrapper.appendChild(toggleSpan);

            // 🌟 4. ระบบกดเปิด-ปิดรหัสผ่าน
            toggleSpan.addEventListener("click", function() {
                const eyeOpen = toggleSpan.querySelector(".eye-open");
                const eyeClosed = toggleSpan.querySelector(".eye-closed");

                if (input.type === "password") {
                    input.type = "text";
                    eyeOpen.style.display = "block";
                    eyeClosed.style.display = "none";
                } else {
                    input.type = "password";
                    eyeOpen.style.display = "none";
                    eyeClosed.style.display = "block";
                }
            });
        });
    });
</script>

</body>
</html>
